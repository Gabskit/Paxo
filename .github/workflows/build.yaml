name: Paxo CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make ar

      - name: Build VM
        run: npm run build:vm

      - name: Build Compiler
        run: npm run build:bcg

      - name: Generate lep.h
        run: npm run gen:lep

      - name: Run VM Tests
        run: npm run test:vm

      - name: Run Compiler Tests
        run: npm run test:bcg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: paxo-build
          path: |
            Build/Lepvm
            Build/Bcg
            Build/lep.h
            Build/libpaxo_vm.a
