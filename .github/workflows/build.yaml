name: Paxo CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      # El runner ya trae gcc (sh/pick_cc.sh lo prefiere) y Node para npm.
      - name: Build VM
        run: npm run build:vm

      - name: Build Compiler
        run: npm run build:bcg

      - name: Test Compiler
        run: npm run test:bcg

      - name: Generate lep.h
        run: npm run gen:lep

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: paxo-build
          path: |
            Build/Lepvm
            Build/Bcg
            Build/lep.h
