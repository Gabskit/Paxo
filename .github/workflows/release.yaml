name: Paxo Release Pipeline

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make

      - name: Build Runtime
        run: |
          make

      - name: Package Release ZIP
        run: |
          mkdir -p paxo-sdk
          cp paxo_vm.h paxo-sdk/
          cp build/libpaxo_vm.a paxo-sdk/
          tar -czvf paxo-sdk-${{ github.ref_name }}-linux-x64.tar.gz paxo-sdk/

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: paxo-sdk-${{ github.ref_name }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
